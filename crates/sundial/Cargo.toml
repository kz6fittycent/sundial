[package]
name = "sundial"
description = "Screen time limits for Linux desktop accounts, with a LAN parent page"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sundial-core.workspace = true
sundial-link.workspace = true
sundial-web.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "signal", "sync", "process", "fs"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rpassword = "7"
libc = "0.2"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
