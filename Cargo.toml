[workspace]
resolver = "3"
members = ["crates/sundial-core", "crates/sundial-link", "crates/sundial-web", "crates/sundial", "crates/sundial-agent", "crates/sundial-app"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/kz6fittycent/sundial"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sundial-core = { path = "crates/sundial-core" }
sundial-web = { path = "crates/sundial-web" }
sundial-link = { path = "crates/sundial-link" }

[profile.release]
lto = true
strip = true
