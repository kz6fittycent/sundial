# Sundial configuration: /etc/sundial/config.toml
# The daemon reloads this file when it changes. Check it with: sundial check-config

[web]
# Parent page (HTTPS, self-signed). Logins: sudo sundial passwd NAME
enabled = true
listen = "0.0.0.0:8461"

[[user]]
name = "kid"
# Active (unlocked, not idle) minutes before a break. 0 = no session limit.
session_minutes = 60
# Break length. Being away this long also refills the session.
break_minutes = 120
# Countdown before time runs out.
warn_minutes = 5
# "logout" ends the session; "lock" locks the screen and keeps re-locking it.
action = "logout"

# Allowed hours per day: mon..sun, or default for days not listed. "none" = no access.
# Windows can't cross midnight; use 24:00 for end of day.
[user.schedule]
default = "08:00-20:00"
fri = "08:00-22:00"
sat = "08:00-22:00"
